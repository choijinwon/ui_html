<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Golden Image · 등록</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="register">
  <div class="shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand-row">
          <div>
            <h1 class="brand">Golden Image</h1>
            <p class="brand-sub">Golden Image 운영 콘솔</p>
          </div>
          <div class="quick-actions">
            <a class="btn primary" href="register.html">등록</a>
            <a class="btn" href="edit.html">수정</a>
          </div>
        </div>
        <nav class="tabs" aria-label="Golden Image tabs">
          <a href="index.html" data-nav="dashboard">Release Dashboard</a>
          <a href="families.html" data-nav="families">Golden Families</a>
          <a href="components.html" data-nav="components">Component Catalog</a>
          <a href="matrix.html" data-nav="matrix">Compatibility Matrix</a>
        </nav>
      </div>
    </header>

    <main class="main">
      <div class="page-head">
        <div>
          <h2 class="page-title">등록 화면</h2>
          <p class="page-sub">Family, Component, Release, Compatibility Rule을 등록합니다.</p>
        </div>
      </div>

      <form class="panel" data-demo-form="register">
        <h3>Golden Image 등록</h3>
        <div class="grid form-grid">
          <div class="field">
            <label for="register-type">등록 유형</label>
            <select id="register-type" name="registerType">
              <option>Golden Image Release</option>
              <option>Golden Family</option>
              <option>Component</option>
              <option>Compatibility Rule</option>
            </select>
          </div>
          <div class="field">
            <label for="status">상태</label>
            <select id="status" name="status">
              <option>draft</option>
              <option>candidate</option>
              <option>approved</option>
              <option>stable</option>
            </select>
          </div>
          <div class="field">
            <label for="family">Family</label>
            <input id="family" name="family" value="pytorch-gpu">
          </div>
          <div class="field">
            <label for="variant">Variant / Runtime Key</label>
            <input id="variant" name="variant" value="cu124-py312">
          </div>
          <div class="field">
            <label for="image-name">Image Name</label>
            <input id="image-name" name="imageName" value="mlflow-pytorch-gpu">
          </div>
          <div class="field">
            <label for="version">Version</label>
            <input id="version" name="version" value="2026.09.01">
          </div>
          <div class="field full">
            <label for="registry">Registry</label>
            <input id="registry" name="registry" value="registry/golden/pytorch:2026.09.01">
          </div>
        </div>

        <h3 class="section-title">Stage Components</h3>
        <div class="grid form-grid">
          <div class="field"><label for="g0">G0 Foundation</label><input id="g0" name="g0" value="ubi9-foundation:9.4"></div>
          <div class="field"><label for="g1">G1 Accelerator</label><input id="g1" name="g1" value="cuda-runtime:12.4.1"></div>
          <div class="field"><label for="g2">G2 Language</label><input id="g2" name="g2" value="python:3.12"></div>
          <div class="field"><label for="g3">G3 Framework</label><input id="g3" name="g3" value="pytorch:2.4.0"></div>
          <div class="field"><label for="g4">G4 ML Platform</label><input id="g4" name="g4" value="mlflow:2.16.0"></div>
          <div class="field"><label for="g5">G5 IDE</label><input id="g5" name="g5" value="openvscode:1.92.2"></div>
          <div class="field full">
            <label for="description">등록 사유</label>
            <textarea id="description" name="description">정기 Golden Image 릴리스 등록</textarea>
          </div>
        </div>

        <div class="form-actions">
          <span class="muted small" data-form-message></span>
          <a class="btn ghost" href="index.html">취소</a>
          <button class="btn primary" type="submit">등록</button>
        </div>
      </form>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
